services:
  open-avatar-chat:
    image: open-avatar-chat:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONFIG_FILE: config/chat_with_gbot.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - AVATAR_BRIDGE_API_KEY=${AVATAR_BRIDGE_API_KEY}
    # Use host network for WebRTC audio/video RTP to work
    # Docker bridge NAT breaks RTP media streams
    # network_mode: host  # Ne fonctionne pas sur Windows
    ports:
      - "8282:8282"
    volumes:
      - ./build:/root/open-avatar-chat/build
      - ./models:/root/open-avatar-chat/models
      - ./model_zoo:/root/open-avatar-chat/model_zoo
      - ./lam_samples:/root/open-avatar-chat/lam_samples
      - ./refaudio:/root/open-avatar-chat/refaudio
      - ./resource:/root/open-avatar-chat/resource
      - ./ssl_certs:/root/open-avatar-chat/ssl_certs
      - ./config:/root/open-avatar-chat/config
    restart: unless-stopped
    command: ["--config", "config/chat_with_gbot.yaml"]

  # TURN relay: le hairpin NAT du routeur ne fonctionne plus, et Docker Desktop
  # (Windows) n'expose pas les ports UDP aleatoires de WebRTC.
  # external-ip = IP LAN de cette machine (10.0.0.175).
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=openavatar"
      - "--lt-cred-mech"
      - "--user=avatar:kqvc6rjn9suai83l02pgbfw7"
      - "--external-ip=10.0.0.175"
      - "--fingerprint"
      - "--no-tls"
      - "--no-cli"
    restart: unless-stopped
