services:
  open-avatar-chat:
    image: open-avatar-chat:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONFIG_FILE: config/chat_with_gbot.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - AVATAR_BRIDGE_API_KEY=${AVATAR_BRIDGE_API_KEY}
      - CLOUDFLARE_TURN_KEY_ID=${CLOUDFLARE_TURN_KEY_ID}
      - CLOUDFLARE_TURN_KEY_API_TOKEN=${CLOUDFLARE_TURN_KEY_API_TOKEN}
    # Use host network for WebRTC audio/video RTP to work
    # Docker bridge NAT breaks RTP media streams
    # network_mode: host  # Ne fonctionne pas sur Windows
    ports:
      - "8282:8282"
    volumes:
      - ./build:/root/open-avatar-chat/build
      - ./models:/root/open-avatar-chat/models
      - ./model_zoo:/root/open-avatar-chat/model_zoo
      - ./lam_samples:/root/open-avatar-chat/lam_samples
      - ./refaudio:/root/open-avatar-chat/refaudio
      - ./resource:/root/open-avatar-chat/resource
      - ./ssl_certs:/root/open-avatar-chat/ssl_certs
      - ./config:/root/open-avatar-chat/config
      - ./.env:/root/open-avatar-chat/.env
      - ./src/service/rtc_service/rtc_provider.py:/root/open-avatar-chat/src/service/rtc_service/rtc_provider.py
      - ./src/service/rtc_service/rtc_stream.py:/root/open-avatar-chat/src/service/rtc_service/rtc_stream.py
      - ./src/service/rtc_service/turn_providers/cloudflare_turn_service.py:/root/open-avatar-chat/src/service/rtc_service/turn_providers/cloudflare_turn_service.py
      - ./src/chat_engine/contexts/session_context.py:/root/open-avatar-chat/src/chat_engine/contexts/session_context.py
      - ./src/chat_engine/core/chat_session.py:/root/open-avatar-chat/src/chat_engine/core/chat_session.py
      - ./src/handlers/vad/silerovad/vad_handler_silero.py:/root/open-avatar-chat/src/handlers/vad/silerovad/vad_handler_silero.py
      - ./src/handlers/asr/whisper_local/asr_handler_whisper_local.py:/root/open-avatar-chat/src/handlers/asr/whisper_local/asr_handler_whisper_local.py
      - ./src/handlers/llm/openai_compatible/llm_handler_openai_compatible.py:/root/open-avatar-chat/src/handlers/llm/openai_compatible/llm_handler_openai_compatible.py
      - ./src/handlers/tts/coqui_local/tts_handler_coqui_local.py:/root/open-avatar-chat/src/handlers/tts/coqui_local/tts_handler_coqui_local.py
      - ./src/handlers/realtime_bridge:/root/open-avatar-chat/src/handlers/realtime_bridge
      - ./src/handlers/avatar/lam/avatar_handler_lam_audio2expression.py:/root/open-avatar-chat/src/handlers/avatar/lam/avatar_handler_lam_audio2expression.py
      - ./src/engine_utils/media_utils.py:/root/open-avatar-chat/src/engine_utils/media_utils.py
      - ./src/handlers/avatar/emotion:/root/open-avatar-chat/src/handlers/avatar/emotion
      - ./src/handlers/client/h5_rendering_client/client_handler_lam.py:/root/open-avatar-chat/src/handlers/client/h5_rendering_client/client_handler_lam.py
      - ./src/handlers/client/rtc_client/client_handler_rtc.py:/root/open-avatar-chat/src/handlers/client/rtc_client/client_handler_rtc.py
      - ./src/handlers/client/rtc_client/frontend/dist:/root/open-avatar-chat/src/handlers/client/rtc_client/frontend/dist
    restart: unless-stopped
    command: ["--config", "config/chat_with_gbot.yaml"]

  # TURN relay: le hairpin NAT du routeur ne fonctionne plus, et Docker Desktop
  # (Windows) n'expose pas les ports UDP aleatoires de WebRTC.
  # external-ip = IP LAN de cette machine (10.0.0.175).
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=openavatar"
      - "--lt-cred-mech"
      - "--user=avatar:kqvc6rjn9suai83l02pgbfw7"
      - "--external-ip=10.0.0.175"
      - "--fingerprint"
      - "--no-tls"
      - "--no-cli"
    restart: unless-stopped
