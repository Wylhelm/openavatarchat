services:
  avatar-bridge:
    build: .
    container_name: avatar-bridge
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/guillaume/.openclaw:/home/guillaume/.openclaw:ro
      - /home/guillaume/.openclaw/agents/avatar:/home/guillaume/.openclaw/agents/avatar
    env_file:
      - .env
    environment:
      - PORT=9000
      - OPENCLAW_GATEWAY_URL=ws://127.0.0.1:18789
      - OPENCLAW_CONFIG_PATH=/home/guillaume/.openclaw/openclaw.json
      - HOME=/home/guillaume
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
