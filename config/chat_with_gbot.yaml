default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    # SSL disabled - use nginx reverse proxy with real cert for HTTPS
    # cert_file: "ssl_certs/localhost.crt"
    # cert_key: "ssl_certs/localhost.key"

  chat_engine:
    model_root: "models"
    concurrent_limit: 5
    turn_config:
      # Public Cloudflare TURN, so a phone off the LAN can relay audio.
      turn_provider: "cloudflare"
      key_id: "${CLOUDFLARE_TURN_KEY_ID}"
      api_token: "${CLOUDFLARE_TURN_KEY_API_TOKEN}"
      ttl: 86400
    handler_search_path:
      - "src/handlers"
    handler_configs:
      LamClient:
        module: client/h5_rendering_client/client_handler_lam
        asset_path: "lam_samples/gbot.zip"
        # Camera zoom. 1 is the renderer default; higher fills more of the frame.
        avatar_scale: 1.5
        # Session lifetime in seconds. 900 closed WebRTC after 15 minutes,
        # which dropped the avatar until Start was clicked again.
        connection_ttl: 86400
      SileroVad:
        enabled: False
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.3
        start_delay: 2048
        # Silence (samples @ 16 kHz) before the turn is closed.
        # 9600 ≈ 0.6 s: short enough to answer quickly, long enough for a
        # natural pause between clauses without splitting a sentence into two turns.
        end_delay: 9600
        buffer_look_back: 5000
        speech_padding: 1024
        barge_in_enabled: True
        barge_in_threshold: 0.45
        barge_in_start_delay: 2048
        barge_in_min_rms: 0.006
        prewarm_delay: 8000
      RealtimeBridge:
        enabled: True
        module: realtime_bridge/realtime_bridge_handler
        ws_url: "ws://10.0.0.253:9000/realtime/voice"
        input_sample_rate: 16000
        output_sample_rate: 24000
        output_frame_size: 480
        reconnect_delay_seconds: 1.0
        chunk_samples: 2400
      WhisperLocal:
        enabled: False
        module: asr/whisper_local/asr_handler_whisper_local
        api_url: "http://10.0.0.175:9400"
        language: "fr"
        warmup_enabled: True
        warmup_timeout: 15
        streaming_asr_enabled: False
        streaming_chunk_seconds: 6.0
        streaming_max_chunk_seconds: 8.0
        trailing_silence_pad_seconds: 0.5
      CoquiLocal:
        enabled: False
        module: tts/coqui_local/tts_handler_coqui_local
        api_url: "http://10.0.0.175:8200"
        voice: "Chandra MacFarland"
        language: "fr"
        warmup_enabled: True
        warmup_timeout: 15
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "gbot"
        history_length: 12
        enable_video_input: True # ensure your llm (the gbot bridge) supports image_url inputs
        video_input_on_demand: True
        # Voice rules live in the OpenClaw bootstrap, not on each turn.
        voice_elaboration_enabled: False
        # G-Bot system prompt is managed by the bridge
        system_prompt: ""
        api_url: "http://10.0.0.253:9000/v1"
        api_key: "${AVATAR_BRIDGE_API_KEY}"
      LAM_Driver:
        module: avatar/lam/avatar_handler_lam_audio2expression
        emotion_weight: 0.95 # 0 disables facial emotions from the [emotion] tag
        emotion_ramp_seconds: 0.35
        micro_expression_strength: 1.4 # brow lifts on stressed syllables + slow drift while speaking; 0 disables
