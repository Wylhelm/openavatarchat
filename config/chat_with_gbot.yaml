default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    # SSL disabled - use nginx reverse proxy with real cert for HTTPS
    # cert_file: "ssl_certs/localhost.crt"
    # cert_key: "ssl_certs/localhost.key"

  chat_engine:
    model_root: "models"
    concurrent_limit: 5
    turn_config:
      turn_provider: "turn_server"
      urls:
        - "turn:10.0.0.175:3478?transport=udp"
      username: "avatar"
      credential: "kqvc6rjn9suai83l02pgbfw7"
    handler_search_path:
      - "src/handlers"
    handler_configs:
      LamClient:
        module: client/h5_rendering_client/client_handler_lam
        asset_path: "lam_samples/gbot.zip"
        # max time a session will last for
        connection_ttl: 900
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.3
        start_delay: 2048
        end_delay: 8000
        buffer_look_back: 5000
        speech_padding: 1024
      WhisperLocal:
        enabled: True
        module: asr/whisper_local/asr_handler_whisper_local
        api_url: "http://10.0.0.175:9400"
        language: "fr"
      CoquiLocal:
        enabled: True
        module: tts/coqui_local/tts_handler_coqui_local
        api_url: "http://10.0.0.175:8200"
        voice: "Chandra MacFarland"
        language: "fr"
      LLMOpenAICompatible:
        max_tokens: 500
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "gbot"
        history_length: 12
        enable_video_input: True # ensure your llm (the gbot bridge) supports image_url inputs
        # G-Bot system prompt is managed by the bridge
        system_prompt: ""
        api_url: "http://10.0.0.253:9000/v1"
        api_key: "${AVATAR_BRIDGE_API_KEY}"
      LAM_Driver:
        module: avatar/lam/avatar_handler_lam_audio2expression
