default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    # SSL disabled - use nginx reverse proxy with real cert for HTTPS
    # cert_file: "ssl_certs/localhost.crt"
    # cert_key: "ssl_certs/localhost.key"

  chat_engine:
    model_root: "models"
    concurrent_limit: 5
    turn_config:
      # Public Cloudflare TURN, so a phone off the LAN can relay audio.
      turn_provider: "cloudflare"
      key_id: "${CLOUDFLARE_TURN_KEY_ID}"
      api_token: "${CLOUDFLARE_TURN_KEY_API_TOKEN}"
      ttl: 86400
    handler_search_path:
      - "src/handlers"
    handler_configs:
      LamClient:
        module: client/h5_rendering_client/client_handler_lam
        asset_path: "lam_samples/gbot.zip"
        # Camera zoom. 1 is the renderer default; higher fills more of the frame.
        avatar_scale: 1.5
        # Session lifetime in seconds. 900 closed WebRTC after 15 minutes,
        # which dropped the avatar until Start was clicked again.
        connection_ttl: 86400
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.3
        start_delay: 2048
        # Silence (samples @ 16 kHz) before the turn is closed.
        # 9600 ≈ 0.6 s: short enough to answer quickly, long enough for a
        # natural pause between sentences. 5000 (~0.3 s) cuts mid-thought;
        # 16000 (1 s) feels slow after you stop.
        end_delay: 9600
        buffer_look_back: 5000
        speech_padding: 1024
      WhisperLocal:
        enabled: True
        module: asr/whisper_local/asr_handler_whisper_local
        api_url: "http://10.0.0.175:9400"
        language: "fr"
        warmup_enabled: True
        warmup_timeout: 15
      CoquiLocal:
        enabled: True
        module: tts/coqui_local/tts_handler_coqui_local
        api_url: "http://10.0.0.175:8200"
        voice: "Chandra MacFarland"
        language: "fr"
        warmup_enabled: True
        warmup_timeout: 15
      LLMOpenAICompatible:
        max_tokens: 500
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "gbot"
        history_length: 12
        enable_video_input: True # ensure your llm (the gbot bridge) supports image_url inputs
        # G-Bot system prompt is managed by the bridge
        system_prompt: ""
        api_url: "http://10.0.0.253:9000/v1"
        api_key: "${AVATAR_BRIDGE_API_KEY}"
      LAM_Driver:
        module: avatar/lam/avatar_handler_lam_audio2expression
        emotion_weight: 1.5 # 0 disables facial emotions from the [emotion] tag
        emotion_ramp_seconds: 0.3
        micro_expression_strength: 2.5 # brow lifts on stressed syllables + slow drift while speaking; 0 disables
