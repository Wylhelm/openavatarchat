default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 5
    handler_search_path:
      - "src/handlers"
    handler_configs:
      LamClient:
        module: client/h5_rendering_client/client_handler_lam
        asset_path: "lam_samples/moi.zip"
        # max time a session will last for
        connection_ttl: 900
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.6  # Increased to reduce false positives from background noise
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      Whisper:
        enabled: True
        module: asr/whisper/asr_handler_whisper
        model_name: "medium"  # Options: tiny, base, small, medium, large
        language: "fr"  # Force French language
      # SenseVoice:
      #   enabled: False
      #   module: asr/sensevoice/asr_handler_sensevoice
      #   model_name: "iic/SenseVoiceSmall"
      ElevenLabs:
        enabled: True
        module: tts/elevenlabs/tts_handler_elevenlabs
        api_key: "sk_f816c34ec8c96dfeefae46c6552a750c79314f1d59447ba8"  # Replace with your ElevenLabs API key or set ELEVENLABS_API_KEY env var
        voice_id: "t373Bu2lZYr0dXL8pzG7"  # Replace with your French male voice ID from ElevenLabs
        model_id: "eleven_multilingual_v2"  # Multilingual model for French support
        sample_rate: 24000
        stability: 0.5  # Voice stability (0.0 to 1.0)
        similarity_boost: 0.75  # Voice similarity boost (0.0 to 1.0)
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "mistral-small3.2:latest"
        enable_video_input: True # ensure your llm support video input
        history_length: 20
        # system_prompt: "Tu es Guillaume, un assistant intelligent qui parle français couramment. Tu as la capacité de vision. RÈGLES STRICTES: 1) Utilise TOUJOURS les accents français corrects (é, è, ê, à, ç, etc.). Exemples: 'être' pas 'etre', 'fatigué' pas 'fatigue', 'français' pas 'francais'. 2) Utilise une grammaire française correcte et naturelle. 3) Ajoute la ponctuation appropriée. 4) Parle de manière fluide et conversationnelle. 5) Réponds uniquement aux questions posées, de manière brève et concise."
        system_prompt: "Tu es un assistant intelligent nommé Guillaume. Tu parles français couramment. Tu as une belle personnalité engageante et stimulante.Tu réponds aux questions de manière concise et brève. Tu as la capacité de vision."
        temperature: 0.7  # Balanced for natural conversation
        max_tokens: 300  # Allow longer, complete responses
        api_url: 'http://127.0.0.1:11434/v1' # ollama
        api_key: "ollama" # Ollama doesn't validate API keys, any value works
      # Dify:
      #   enabled: True
      #   module: llm/dify/llm_handler_dify
      #   api_key: app-J3LiQRqh4MrOOvS6vpyrgIOW
      #   api_url: 'http://localhost/v1'
      LAM_Driver:
        module: avatar/lam/avatar_handler_lam_audio2expression
