default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        # max time a session will last for
        connection_ttl: 900
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.5
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      MiniCPM-o:
        enabled: True
        module: llm/minicpm/llm_handler_minicpm
        model_name: "MiniCPM-o-2_6"
        # model_name: "MiniCPM-o-2_6-int4"
        voice_prompt: "You are an AI assistant named Vanessa. You can accept video, audio, and text inputs, and output voice and text. Imitate the voice characteristics in the input audio. Always respond in English."
        assistant_prompt: "As the assistant named Vanessa, you will speak using this voice style. Always respond in English."
        enable_video_input: True  # False to prevent automatic video analysis on regular questions
        skip_video_frame: 2
      LiteAvatar:
        module: avatar/liteavatar/avatar_handler_liteavatar
        avatar_name: 20250408/P1hcT8b49FkdSjjNT_fJ4N5g
        fps: 25
        debug: false
        enable_fast_mode: false
        use_gpu: false
