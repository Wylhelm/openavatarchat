default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 1
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        # max time a session will last for
        connection_ttl: 900
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.5
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      SenseVoice:
        enabled: True
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
      CosyVoice:
        enabled: True
        module: tts/cosyvoice/tts_handler_cosyvoice
        # api_url: 'http://127.0.0.1:50000/inference_sft' #run CosyVoice/runtime/python/fastapi/server.py
        model_name: "iic/CosyVoice-300M-SFT" # run cosyvoice in code
        spk_id: "英文女" # English female voice (use "英文男" for male)
        # ref_audio_path: "open-video-chat/src/third_party/CosyVoice/asset/zero_shot_prompt.wav" #use zero_shot model
        # ref_audio_text: "希望你以后能够做的比我还好呦。"
        sample_rate: 24000
        process_num: 2
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "llama3.2-vision:11b"
        enable_video_input: False # ensure your llm support video input
        history_length: 20
        system_prompt: "You are an AI assistant named Vanessa. Respond to questions briefly and naturally, using appropriate punctuation. You always respond in English."
        api_url: 'http://127.0.0.1:11434/v1' # ollama
        api_key: "ollama" # Ollama doesn't validate API keys, any value works
        # api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1" # Bailian API
        # api_url: 'https://generativelanguage.googleapis.com/v1beta/openai/'
        # api_key: '' # default=os.getenv("DASHSCOPE_API_KEY")
      LiteAvatar:
        module: avatar/liteavatar/avatar_handler_liteavatar
        avatar_name: 20250408/sample_data
        fps: 25
        debug: false
        enable_fast_mode: false
        use_gpu: false
